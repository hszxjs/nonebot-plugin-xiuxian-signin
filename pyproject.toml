[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-xiuxian-signin"
version = "0.5.2"
description = "A NoneBot2 cultivation signin plugin with image panels, fishing, realms, mystic realms, items, duels and PicMenu Next support."
readme = "README.md"
requires-python = ">=3.12, <4.0"
license = { text = "MIT" }
authors = [
    { name = "fallen_rainy" },
]
keywords = ["nonebot", "nonebot2", "plugin", "onebot", "xiuxian", "signin", "picmenu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "nonebot2>=2.2.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-localstore>=0.7.0",
    "Pillow>=10.0.0",
    "httpx>=0.24.0",
    "pydantic>=1.10",
    "starlette>=0.37.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/hszxjs/nonebot-plugin-xiuxian-signin"
Repository = "https://github.com/hszxjs/nonebot-plugin-xiuxian-signin"
Issues = "https://github.com/hszxjs/nonebot-plugin-xiuxian-signin/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.nonebot]
plugins = ["nonebot_plugin_xiuxian_signin"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["nonebot_plugin_xiuxian_signin*"]

[tool.setuptools.package-data]
nonebot_plugin_xiuxian_signin = [
    "py.typed",
    "assets/fonts/HarmonyOS_Sans_SC.ttf",
    "assets/fonts/LICENSE-update.txt",
    "assets/character_portraits/manifest.json",
    "assets/character_portraits/portraits/*.png",
    "assets/item_icons/item_icon_records.json",
    "assets/item_icons/items/*.png",
    "assets/panel_backgrounds/*.png",
    "assets/beast_realm_spell_icons/*.png",
    "assets/admin_web/*",
    "assets/admin_web/assets/*",
    "assets/realm_quality_icons/realm_quality_icon_manifest.json",
    "assets/realm_quality_icons/quality_*.png",
    "assets/spirit_root_icons/spirit_root_icon_manifest.json",
    "assets/spirit_root_icons/*.png",
    "assets/ui_sprite/signin/output/sprites/*.png",
    "assets/mystic_maps/manifest.json",
    "assets/mystic_maps/templates.json",
    # 背景图（202 MB）刻意不进 wheel：PyPI 单文件上限 100 MB，这批图由
    # scripts/build_asset_bundle.py 打成 zip 随 Release 分发，首次启动下载（R-09）。
    "assets/mystic_events/*.json",
    "assets/signin_calendar/*.png",
    "assets/mystic_dungeon_ui/*.png",
]

# include-package-data 会把 MANIFEST.in 命中的文件一并塞进 wheel，光靠 package-data
# 不列、MANIFEST 里 prune 都挡不住，必须显式排除。背景图 202 MB 走 Release 资源包。
[tool.setuptools.exclude-package-data]
nonebot_plugin_xiuxian_signin = [
    "assets/mystic_maps/backgrounds/*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = [
    "nonebot_plugin_xiuxian_signin/mystic_battle.py",
    "nonebot_plugin_xiuxian_signin/mystic_cards.py",
    "nonebot_plugin_xiuxian_signin/mystic_dungeon.py",
    # mystic_runtime.py 暂不纳入：阶段 6 秘境推倒重做（Q4=C）会整体删除这 6,776 行，
    # 现在给它补类型是纯浪费。删除时连同这一行一起移除。
    "nonebot_plugin_xiuxian_signin/storage/__init__.py",
    "nonebot_plugin_xiuxian_signin/admin.py",
    "nonebot_plugin_xiuxian_signin/admin_auth.py",
    "nonebot_plugin_xiuxian_signin/config_schema.py",
]
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
