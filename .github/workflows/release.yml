name: Release

# 打 v* 标签时构建 wheel 并挂到 GitHub Release。
# 有意不在这里发布到 PyPI：wheel 目前 250+ MB，超过 PyPI 单文件 100 MB 上限，
# 必须先完成 R-09（资源出 wheel）。R-09 之后加 trusted publishing 即可。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel
        run: pip wheel . -w dist --no-deps

      - name: 校验内容完整性
        run: python scripts/check_wheel_contents.py dist/*.whl

      - name: 创建 Release 并附带 wheel
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.whl --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 14
